name: Full Euro 2024 data analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/full-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download Euro 2024 StatsBomb event data
        run: python scripts/download_data.py
      - name: Inspect source data
        run: python scripts/inspect_data.py
      - name: Build analysis tables
        run: python -m src.build_analysis
      - name: Compile Python files
        run: python -m compileall -q scripts src tests app.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Upload reproducible analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: euro-2024-goalkeeper-analysis
          path: data/processed/
          if-no-files-found: error
          retention-days: 30
